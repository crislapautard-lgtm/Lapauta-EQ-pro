name: Build La Pauta EQ Pro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer EXE
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\LaPautaEQPro.iss
        shell: powershell

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: LaPautaEQPro-VST3
          path: build/LaPautaEQPro_artefacts/Release/VST3/

      - name: Upload Installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: LaPautaEQPro-Setup
          path: installer-output/LaPautaEQPro-Setup.exe
