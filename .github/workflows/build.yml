
name: Build La Pauta EQ Pro VST3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --parallel 2

      - name: Locate VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1

          if ($null -eq $plugin) {
            throw "ERROR: VST3 plugin not found"
          }

          "PLUGIN_PATH=$($plugin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package VST3
        uses: actions/upload-artifact@v4
        with:
          name: La-Pauta-EQ-Pro-VST3-Windows-x64
          path: ${{ env.PLUGIN_PATH }}
