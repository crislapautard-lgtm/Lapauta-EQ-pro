name: Build La Pauta EQ Pro VST3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile VST3 Windows 64-bit
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure JUCE project
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compile La Pauta EQ Pro
        run: cmake --build build --config Release --parallel 2

      - name: Find VST3 plugin
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" |
            Select-Object -First 1

          if ($null -eq $plugin) {
            Write-Error "The VST3 plugin was not found after compilation."
            exit 1
          }

          Write-Host "VST3 found: $($plugin.FullName)"
          "PLUGIN_PATH=$($plugin.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: La-Pauta-EQ-Pro-Windows-x64
          path: ${{ env.PLUGIN_PATH }}
          if-no-files-found: error
          retention-days: 30
