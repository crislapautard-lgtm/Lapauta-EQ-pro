name: Build La Pauta EQ Pro VST3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile VST3 Windows 64-bit
    runs-on: windows-2025-vs2026

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Activate Visual Studio C++ environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify compiler and Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "MSVC C++ compiler was not found."
          }

          if (-not (Get-Command ninja.exe -ErrorAction SilentlyContinue)) {
            throw "Ninja was not found."
          }

          if (-not (Get-Command cmake.exe -ErrorAction SilentlyContinue)) {
            throw "CMake was not found."
          }

      - name: Configure JUCE project
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile VST3
        run: cmake --build build --config Release --parallel 2

      - name: Find VST3 plugin
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" |
            Select-Object -First 1

          if ($null -eq $plugin) {
            throw "The VST3 plugin was not found after compilation."
          }

          Write-Host "VST3 found: $($plugin.FullName)"

          "PLUGIN_PATH=$($plugin.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: La-Pauta-EQ-Pro-Windows-x64
          path: ${{ env.PLUGIN_PATH }}
          if-no-files-found: error
          retention-days: 30
