name: Build VST3 + Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build Installer
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\LaPautaEQPro.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: LaPautaEQPro-Setup
          path: installer/Output/LaPautaEQPro-Setup.exe

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: LaPautaEQPro-VST3
          path: build/LaPautaEQPro_artefacts/Release/VST3/LaPautaEQPro.vst3
